name: Build & Push — Bitterbot image

# Rebuilds the Bitterbot image from the official source repo and
# pushes it to Docker Hub so the VPS can simply `docker pull`.
#
# Secrets required in GitHub → Settings → Secrets → Actions:
#   DOCKERHUB_USERNAME : monolithoid
#   DOCKERHUB_TOKEN    : Docker Hub → Account Settings → Security → New Access Token
#
# Why a SHA is pinned and not `main`:
#   main moves fast; the last commit verified as stable is pinned so that
#   an automatic weekly rebuild does not pick up a TypeScript regression.
#   To move to a new commit: change BITTERBOT_DEFAULT_REF below
#   or use the "bitterbot_ref" input of the manual trigger.
#
#   Pin history:
#     be7b696 (8 Apr 2026) → e0d7d12 broke the TypeScript build (Dream Engine types)
#     95907c2 (18 Apr 2026) → upstream CI green, TS errors fixed since 050008d
#     85b5095 (19 avr. 2026) → fix wizard timeout uniquement, CI verte

env:
  # Last commit verified to build.
  # Accepts: short SHA (95907c2), long SHA, branch name, tag.
  BITTERBOT_DEFAULT_REF: 85b5095

# ⚠️ TEMPORARILY DISABLED: the Bitterbot build fails too often,
# the project is not stable enough yet. Only the manual trigger remains.
# To re-enable: uncomment the `schedule` and `push` blocks below.
on:
  # Rebuild hebdomadaire automatique (lundi 03h00 UTC)
  # schedule:
  #   - cron: '0 3 * * 1'

  # Manual trigger with an optional ref
  # → GitHub Actions → "Run workflow" → champ "Bitterbot commit SHA or branch"
  workflow_dispatch:
    inputs:
      bitterbot_ref:
        description: 'Bitterbot commit SHA or branch (leave empty = BITTERBOT_DEFAULT_REF)'
        required: false
        default: ''

  # Rebuild if this workflow file changes (e.g. SHA change)
  # push:
  #   paths:
  #     - '.github/workflows/build-bitterbot.yml'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push monolithoid/bitterbot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout of our repo (needed to access bitterbot/Dockerfile)
      # ----------------------------------------------------------------
      - name: Checkout ia-agent
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Resolve the ref to use
      #    Priority: manual input > BITTERBOT_DEFAULT_REF
      # ----------------------------------------------------------------
      - name: Resolve Bitterbot ref
        id: ref
        env:
          INPUT_REF: ${{ github.event.inputs.bitterbot_ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> $GITHUB_OUTPUT
            echo "source=manual input" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ env.BITTERBOT_DEFAULT_REF }}" >> $GITHUB_OUTPUT
            echo "source=default (BITTERBOT_DEFAULT_REF)" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------------------------------
      # 3. Clone Bitterbot at the pinned ref
      #    Cloned here (and not in the Docker context) to:
      #    - support short and long SHAs, branches and tags
      #    - get a clear error message if the ref does not exist
      # ----------------------------------------------------------------
      - name: Clone Bitterbot at pinned ref
        env:
          BITTERBOT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          git clone https://github.com/Bitterbot-AI/bitterbot-desktop.git bitterbot-src
          cd bitterbot-src
          git checkout "$BITTERBOT_REF"
          echo "HEAD=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "Building from ref : $BITTERBOT_REF"
          echo "Full SHA          : $(git rev-parse HEAD)"
          echo "Source            : ${{ steps.ref.outputs.source }}"

      # ----------------------------------------------------------------
      # 4. Docker Hub authentication
      # ----------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------------
      # 5. QEMU + Buildx
      # ----------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------------
      # 6. Metadata — OCI tags
      # ----------------------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: monolithoid/bitterbot
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}
            type=raw,value=sha-${{ env.HEAD }}

      # ----------------------------------------------------------------
      # 7. Build from the local clone + push to Docker Hub
      #
      # context: cloned Bitterbot source (./bitterbot-src)
      # file   : our fixed Dockerfile (./bitterbot/Dockerfile)
      #          → replaces the upstream one, which references ui/ and patches/
      #            missing from the repo, and a nonexistent pnpm ui:build.
      # ----------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./bitterbot-src
          file: ./core/bitterbot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ----------------------------------------------------------------
      # 8. Summary in the Actions tab
      # ----------------------------------------------------------------
      - name: Build summary
        env:
          BITTERBOT_REF: ${{ steps.ref.outputs.ref }}
        run: |
          echo "## Image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ref Bitterbot :** \`$BITTERBOT_REF\` → SHA \`${{ env.HEAD }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Command |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`docker pull monolithoid/bitterbot:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| versioned | \`docker pull monolithoid/bitterbot:build-${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| by SHA | \`docker pull monolithoid/bitterbot:sha-${{ env.HEAD }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To update the VPS:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker compose pull bitterbot-gateway && docker compose up -d bitterbot-gateway" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
