<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Régie NAO · Jeux</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --line: #2a313b; --text: #e6e9ee; --muted: #8b95a3;
    --ok: #3ecf8e; --warn: #f0b429; --err: #ef5b5b; --accent: #f07b5b; --game: #9fd3ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
           padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
  a { color: var(--muted); }
  header .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); display: inline-block; }
  .dot.up { background: var(--ok); }
  main { padding: 12px 16px 32px; max-width: 1100px; margin: 0 auto;
         display: grid; gap: 16px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  section.wide { grid-column: 1 / -1; }
  button { background: #1e242c; color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.danger { border-color: var(--err); color: var(--err); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .muted { color: var(--muted); }
  .mask { font: 700 26px/1.3 ui-monospace, "Cascadia Mono", monospace; letter-spacing: .12em;
          white-space: nowrap; overflow-x: auto; margin: 6px 0; }
  .bad { color: var(--err); text-decoration: line-through; }
  .event { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: #1e242c; }
  .field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
           border-top: 1px solid var(--line); padding: 10px 0; }
  .field:first-of-type { border-top: 0; }
  .field .help { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  input[type=number] { width: 90px; background: #1e242c; color: var(--text); border: 1px solid var(--line);
                       border-radius: 6px; padding: 5px 8px; font: inherit; }
  .roles label { margin-left: 10px; white-space: nowrap; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  td.pts, th.pts { text-align: right; }
  th { color: var(--muted); font-weight: 500; }
  .msg { margin-top: 10px; min-height: 1.4em; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>Jeux avec les viewers</h1>
  <span class="pill"><span id="link" class="dot"></span><span id="linkText">game-master…</span></span>
  <span class="spacer"></span>
  <a id="back" href="./">← Régie</a>
</header>
<main>
  <section>
    <h2>Partie en cours</h2>
    <div id="game" class="muted">…</div>
    <div class="row" style="margin-top:10px">
      <button id="stop" class="danger" type="button" disabled>Annuler la partie</button>
    </div>
  </section>

  <section>
    <h2>Classement</h2>
    <table>
      <thead><tr><th>#</th><th>Joueur</th><th class="pts">Points</th></tr></thead>
      <tbody id="scores"><tr><td colspan="3" class="muted">…</td></tr></tbody>
    </table>
    <div class="row" style="margin-top:10px">
      <button id="reset" class="danger" type="button">Remettre les scores à zéro</button>
    </div>
    <div id="scoresMsg" class="msg"></div>
  </section>

  <section class="wide">
    <h2>Réglages</h2>
    <p class="muted" style="margin:0 0 6px">Qui peut lancer une partie et le délai entre deux coups
      s'appliquent tout de suite ; les réglages du pendu à la prochaine partie.
      Ils sont gardés au redémarrage de game-master.</p>
    <form id="settings"></form>
    <div class="row" style="margin-top:6px">
      <button id="save" class="primary" type="button" disabled>Enregistrer</button>
      <button id="undo" type="button" disabled>Annuler les modifications</button>
    </div>
    <div id="settingsMsg" class="msg"></div>
  </section>
</main>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const Q = "token=" + encodeURIComponent(TOKEN);
const ROLE_NAMES = { everyone: "Tout le monde", subscriber: "Abonnés", vip: "VIP", moderator: "Modos" };
document.getElementById("back").href = "./?" + Q;

async function call(method, path, body) {
  const resp = await fetch(path + (path.includes("?") ? "&" : "?") + Q, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await resp.json(); } catch (e) { /* empty body */ }
  if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
  return data;
}

function el(tag, attrs = {}, text = "") {
  const node = document.createElement(tag);
  Object.assign(node, attrs);
  if (text) node.textContent = text;
  return node;
}

function setLink(up, text) {
  document.getElementById("link").className = "dot" + (up ? " up" : "");
  document.getElementById("linkText").textContent = text;
}

// ── Running game (refreshed every 2 s) ───────────────────────────────────────

let currentGame = "hangman";

function renderGame(state) {
  const box = document.getElementById("game");
  box.replaceChildren();
  const a = state.activity;
  document.getElementById("stop").disabled = !a;
  if (!a) {
    box.className = "muted";
    box.textContent = "Aucune partie en cours.";
  } else {
    box.className = "";
    currentGame = a.game;
    const v = a.view || {};
    box.append(el("div", {}, `${a.name} — lancée par ${a.started_by || "?"}`
                              + (v.level ? ` · niveau ${v.level}` : "")));
    if (v.mask !== undefined) {
      box.append(el("div", { className: "mask" }, v.mask));
      if (v.definition) box.append(el("div", { className: "muted" }, "Indice : " + v.definition));
      const tried = el("div");
      const wrong = new Set(v.wrong || []);
      (v.tried || []).forEach(c => tried.append(el("span", { className: wrong.has(c) ? "bad" : "" }, c), " "));
      box.append(tried);
      if ((v.wrong_words || []).length) {
        const words = el("div", {}, "Mots faux : ");
        v.wrong_words.forEach(w => words.append(el("span", { className: "bad" }, w), " "));
        box.append(words);
      }
      box.append(el("div", { className: "muted" }, `Erreurs : ${v.errors} / ${v.max_errors}`));
    } else {
      box.append(el("div", {}, a.summary || ""));
    }
    if (a.last_player) box.append(el("div", { className: "muted" }, "Dernier coup : " + a.last_player));
  }
  const last = state.last_event;
  if (last) box.append(el("div", { className: "event" }, last.text));
}

async function refresh() {
  try {
    const state = await call("GET", "game/state");
    setLink(true, "game-master OK");
    renderGame(state);
    await refreshScores();
  } catch (e) {
    setLink(false, e.message);
  }
}

document.getElementById("stop").onclick = async () => {
  if (!confirm("Annuler la partie en cours ? NAO l'annoncera.")) return;
  try { await call("POST", "game/stop"); refresh(); } catch (e) { alert(e.message); }
};

// ── Ranking ──────────────────────────────────────────────────────────────────

async function refreshScores() {
  const data = await call("GET", "game/scores?game=" + encodeURIComponent(currentGame) + "&n=10");
  const body = document.getElementById("scores");
  body.replaceChildren();
  if (!data.top.length) {
    const tr = el("tr");
    tr.append(el("td", { colSpan: 3, className: "muted" }, "Aucun point pour l'instant."));
    body.append(tr);
    return;
  }
  data.top.forEach((s, i) => {
    const tr = el("tr");
    tr.append(el("td", {}, String(i + 1)), el("td", {}, s.name), el("td", { className: "pts" }, String(s.points)));
    body.append(tr);
  });
}

document.getElementById("reset").onclick = async () => {
  if (!confirm("Remettre tous les scores du pendu à zéro ? C'est définitif.")) return;
  const msg = document.getElementById("scoresMsg");
  try {
    await call("POST", "game/scores/reset", { game: currentGame });
    msg.className = "msg ok"; msg.textContent = "Scores remis à zéro.";
    refreshScores();
  } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
};

// ── Settings (form built from game-master's schema) ──────────────────────────

let schema = [], saved = {};

function renderSettings(values) {
  const form = document.getElementById("settings");
  form.replaceChildren();
  for (const item of schema) {
    const field = el("div", { className: "field" });
    field.append(el("label", { htmlFor: "s_" + item.key }, item.label));
    if (item.type === "roles") {
      const box = el("div", { className: "roles", id: "s_" + item.key });
      for (const [role, name] of Object.entries(ROLE_NAMES)) {
        const label = el("label");
        const input = el("input", { type: "checkbox", value: role,
                                    checked: (values[item.key] || []).includes(role) });
        input.onchange = () => {
          // "Tout le monde" and the roles exclude each other.
          if (input.checked) box.querySelectorAll("input").forEach(o => {
            if (o !== input && (role === "everyone" || o.value === "everyone")) o.checked = false;
          });
          dirty();
        };
        label.append(input, " " + name);
        box.append(label);
      }
      field.append(box);
    } else {
      field.append(el("input", { type: "number", id: "s_" + item.key, min: item.min, max: item.max,
                                 step: item.type === "int" ? 1 : "any", value: values[item.key],
                                 oninput: dirty }));
    }
    if (item.help) field.append(el("div", { className: "help" }, item.help));
    form.append(field);
  }
  document.getElementById("save").disabled = true;
  document.getElementById("undo").disabled = true;
}

function formValues() {
  const out = {};
  for (const item of schema) {
    const node = document.getElementById("s_" + item.key);
    out[item.key] = item.type === "roles"
      ? [...node.querySelectorAll("input:checked")].map(i => i.value)
      : Number(node.value);
  }
  return out;
}

function dirty() {
  const changed = JSON.stringify(formValues()) !== JSON.stringify(saved);
  document.getElementById("save").disabled = !changed;
  document.getElementById("undo").disabled = !changed;
  document.getElementById("settingsMsg").textContent = "";
}

async function loadSettings() {
  try {
    const data = await call("GET", "game/settings");
    schema = data.schema; saved = data.values;
    renderSettings(saved);
  } catch (e) {
    const msg = document.getElementById("settingsMsg");
    msg.className = "msg err"; msg.textContent = e.message;
  }
}

document.getElementById("save").onclick = async () => {
  const msg = document.getElementById("settingsMsg");
  try {
    const data = await call("POST", "game/settings", formValues());
    saved = data.values;
    renderSettings(saved);
    msg.className = "msg ok"; msg.textContent = "Réglages enregistrés.";
  } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
};
document.getElementById("undo").onclick = () => renderSettings(saved);

loadSettings();
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
