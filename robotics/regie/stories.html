<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Régie NAO · Histoires</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --line: #2a313b; --text: #e6e9ee; --muted: #8b95a3;
    --ok: #3ecf8e; --warn: #f0b429; --err: #ef5b5b; --accent: #f07b5b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
           padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  a { color: var(--muted); }
  header .spacer { flex: 1; }
  main { padding: 12px 16px 32px; max-width: 800px; margin: 0 auto; display: grid; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .muted { color: var(--muted); }
  button, select { background: #1e242c; color: var(--text); border: 1px solid var(--line);
                   border-radius: 6px; padding: 6px 12px; font: inherit; }
  button { cursor: pointer; min-width: 52px; font-size: 18px; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { border-color: var(--accent); color: var(--accent); }
  select { max-width: 100%; }
  #status { font-weight: 600; }
  #status.playing { color: var(--ok); }
  #status.paused { color: var(--warn); }
  #text { margin: 10px 0 0; font-size: 17px; line-height: 1.5; }
  .pending { color: var(--warn); }
  .err { color: var(--err); }
  .msg { min-height: 1.4em; margin-top: 10px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .cast { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
  .cast + .cast { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 16px; }
  #save { font-size: 14px; margin-top: 14px; }
  #saved { margin-left: 10px; }
  .fields { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px;
            align-items: center; margin-top: 12px; }
  input { background: #1e242c; color: var(--text); border: 1px solid var(--line);
          border-radius: 6px; padding: 6px 10px; font: inherit; width: 100%; }
  button.text { font-size: 14px; }
  form button.text { margin-top: 12px; }
  #chapters { list-style: none; margin: 14px 0 0; padding: 0; max-height: 320px; overflow: auto; }
  #chapters li { display: flex; gap: 10px; align-items: center; padding: 6px 0;
                 border-top: 1px solid var(--line); }
  #chapters li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #joblog { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
  #soundlist { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; }
  #soundlist li { padding: 8px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  #soundlist .theme { color: #c77dff; font-weight: 600; }
  #soundlist .before { overflow-wrap: anywhere; }
  #soundlist input[type=file] { width: auto; }
</style>
</head>
<body>
<header>
  <h1>Histoires</h1>
  <span class="spacer"></span>
  <a id="back" href="./">← Régie</a>
</header>
<main>
  <section>
    <div class="row">
      <label for="story">Histoire</label>
      <select id="story"></select>
    </div>
    <div class="row" style="margin-top:12px" role="toolbar" aria-label="Lecture">
      <button type="button" data-cmd="seek" data-unit="chapter" data-delta="-1" title="Chapitre précédent" aria-label="Chapitre précédent">⏮</button>
      <button type="button" data-cmd="seek" data-unit="passage" data-delta="-1" title="Passage précédent" aria-label="Passage précédent">⏪</button>
      <button type="button" data-cmd="play" id="play" title="Lecture" aria-label="Lecture">▶</button>
      <button type="button" data-cmd="pause" id="pause" title="Pause (fin du passage)" aria-label="Pause">⏸</button>
      <button type="button" data-cmd="stop" id="stop" title="Stop (fin du passage ; à l'arrêt : libère l'activité « histoire »)" aria-label="Stop">⏹</button>
      <button type="button" data-cmd="seek" data-unit="passage" data-delta="1" title="Passage suivant" aria-label="Passage suivant">⏩</button>
      <button type="button" data-cmd="seek" data-unit="chapter" data-delta="1" title="Chapitre suivant" aria-label="Chapitre suivant">⏭</button>
    </div>
    <div class="msg err" id="message" role="alert"></div>
  </section>
  <section aria-live="polite">
    <div class="row"><span id="status">…</span><span id="position" class="muted"></span>
      <span id="pending" class="pending"></span></div>
    <p id="text"></p>
  </section>
  <section id="casting" hidden>
    <h2>Personnages et voix</h2>
    <p class="muted">Le narrateur garde la voix de NAO. Modifiable quand la lecture est arrêtée.</p>
    <div class="cast" id="characters"></div>
    <div class="cast" id="slots"></div>
    <button type="button" id="save">Enregistrer</button><span id="saved" role="status"></span>
  </section>
  <section id="sounds" hidden>
    <h2>Sons</h2>
    <p class="muted">Bruits proposés à la préparation, joués après le passage cité. Un son sans
      fichier n'est pas joué. Modifiable quand la lecture est arrêtée.</p>
    <ul id="soundlist"></ul>
    <div class="msg" id="soundmessage" role="status"></div>
  </section>
  <section>
    <h2>Livres</h2>
    <div class="row">
      <label for="book">Livre</label>
      <select id="book"></select>
    </div>
    <form id="bookform">
      <div class="fields">
        <label for="file" class="import">Fichier</label>
        <input type="file" id="file" class="import" accept=".txt,.html,.htm,text/plain,text/html">
        <label for="title">Titre</label><input id="title" required>
        <label for="author">Auteur</label><input id="author" required>
        <label for="year">Année de sortie</label><input id="year" type="number" step="1">
        <label for="newid" class="import">Identifiant</label>
        <input id="newid" class="import" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,80}">
        <label for="rule" class="import" title="Vide : « Chapitre … » ou un chiffre romain seul sur sa ligne">Titres de chapitre (regex)</label>
        <input id="rule" class="import" placeholder="automatique">
      </div>
      <button type="submit" class="text" id="booksave">Importer</button>
    </form>
    <div class="msg" id="bookmessage" role="status"></div>
    <ul id="chapters"></ul>
    <div id="job" hidden><div id="jobstatus" role="status"></div><div id="joblog" class="muted"></div></div>
  </section>
</main>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const Q = "token=" + encodeURIComponent(TOKEN);
const STATUS = { stopped: "Arrêtée", playing: "En lecture", paused: "En pause" };
const ASKED = { paused: "pause demandée", stopped: "arrêt demandé" };
const $ = id => document.getElementById(id);
$("back").href = "./?" + Q;
let state = {};
let commandError = "";

async function call(method, path, body) {
  const resp = await fetch(path + (path.includes("?") ? "&" : "?") + Q, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await resp.json(); } catch (e) { /* empty body */ }
  if (!resp.ok) {
    const error = new Error(data.error || `HTTP ${resp.status}`);
    error.data = data;
    throw error;
  }
  return data;
}

function render(next) {
  state = next;
  const status = state.status || "stopped";
  // The running story stays selected while it is read or paused.
  if (status !== "stopped" && state.story) $("story").value = state.story;
  $("story").disabled = status !== "stopped";
  $("status").textContent = STATUS[status] || status;
  $("status").className = status;
  const shown = state.story && state.story === $("story").value;
  $("position").textContent = shown
    ? `chapitre ${state.chapter} / ${state.chapters} — passage ${state.passage} / ${state.passages}`
      + (state.lag_ms > 500 ? ` — retard ${(state.lag_ms / 1000).toFixed(1)} s` : "")
    : "";
  $("text").textContent = shown ? state.text : "";
  const pending = state.pending, parts = [];
  if (pending) {
    if (pending.target) parts.push(`→ chapitre ${pending.target.chapter}, passage ${pending.target.passage}`);
    if (pending.command) parts.push(ASKED[pending.command]);
  }
  $("pending").textContent = parts.join(" · ");
  $("play").classList.toggle("on", status === "playing");
  $("pause").classList.toggle("on", status === "paused");
  $("pause").disabled = status !== "playing";
  for (const button of document.querySelectorAll("button[data-cmd]")) {
    if (button.id !== "stop" && button.id !== "pause") button.disabled = !$("story").value;
  }
  $("message").textContent = commandError || state.error || "";
  lockCasting();
}

// Characters and voices: loaded when the story changes, never by the refresh loop
// (it would undo the choices not saved yet).
const SLOT_NAMES = { f1: "Féminin 1", f2: "Féminin 2", f3: "Féminin 3",
                     m1: "Masculin 1", m2: "Masculin 2", m3: "Masculin 3" };
let castStory = "";

function lockCasting() {
  const locked = (state.status || "stopped") !== "stopped";
  for (const field of $("casting").querySelectorAll("select, button")) field.disabled = locked;
  for (const field of $("sounds").querySelectorAll("select, input, button.change")) field.disabled = locked;
}

function choice(label, options, value, data) {
  const name = document.createElement("label");
  name.textContent = label;
  const select = document.createElement("select");
  Object.assign(select.dataset, data);
  select.id = name.htmlFor = "cast-" + Object.entries(data)[0].join("-");
  for (const [id, text] of options) {
    const option = document.createElement("option");
    option.value = id;
    option.textContent = text;
    select.append(option);
  }
  select.value = value;
  select.addEventListener("change", () => { $("saved").textContent = ""; });
  return [name, select];
}

function renderCasting(cast) {
  $("characters").replaceChildren(...cast.characters.flatMap(c => {
    const [name, select] = choice(c.name, Object.entries(SLOT_NAMES), c.voice, { character: c.id });
    name.title = c.description;
    return [name, select];
  }));
  $("characters").hidden = !cast.characters.length;
  const voices = cast.choices.map(v => [v.id, v.label]);
  $("slots").replaceChildren(...Object.entries(SLOT_NAMES).flatMap(([slot, label]) => {
    const current = cast.voices[slot];
    // A voice set by hand in the script stays offered.
    const offered = voices.some(([id]) => id === current) ? voices : [...voices, [current, current]];
    return choice(label, offered, current, { slot });
  }));
  $("casting").hidden = false;
  lockCasting();
}

async function loadCasting() {
  const story = $("story").value;
  castStory = story;
  $("casting").hidden = true;
  $("saved").textContent = "";
  if (!story) return;
  try {
    const cast = await call("GET", "stories/casting?story=" + encodeURIComponent(story));
    if (castStory === story) renderCasting(cast);
  } catch (e) {
    commandError = e.message;
  }
}

$("save").addEventListener("click", async () => {
  const values = (key) => Object.fromEntries(
    [...$("casting").querySelectorAll(`select[data-${key}]`)].map(s => [s.dataset[key], s.value]));
  $("saved").className = "";
  try {
    renderCasting(await call("POST", "stories/casting",
      { story: castStory, characters: values("character"), voices: values("slot") }));
    $("saved").textContent = "Enregistré, pris en compte à la prochaine lecture.";
    refresh();
  } catch (e) {
    $("saved").className = "err";
    $("saved").textContent = e.message;
  }
});

async function refresh() {
  try {
    render(await call("GET", "stories/state?story=" + encodeURIComponent($("story").value)));
  } catch (e) {
    $("message").textContent = e.message;
  }
}

async function loadStories() {
  const { stories } = await call("GET", "stories/list");
  const select = $("story");
  const selected = select.value;
  select.replaceChildren(...stories.map(s => {
    const option = document.createElement("option");
    option.value = s.id;
    option.textContent = s.error ? `${s.id} — illisible` : `${s.title} — ${s.author} (${s.passages} passages)`;
    option.title = s.error || "";
    return option;
  }));
  commandError = stories.length ? "" : "Aucune histoire préparée : importe un livre ci-dessous.";
  const current = await call("GET", "stories/state");
  if (stories.some(s => s.id === selected)) select.value = selected;
  else if (current.story) select.value = current.story;
}

for (const button of document.querySelectorAll("button[data-cmd]")) {
  button.addEventListener("click", async () => {
    const { cmd, unit, delta } = button.dataset;
    const body = { story: $("story").value };
    if (cmd === "seek") Object.assign(body, { unit, delta: Number(delta) });
    commandError = "";
    try {
      render(await call("POST", "stories/" + cmd, body));
    } catch (e) {
      commandError = e.message;
      render(e.data && e.data.status ? e.data : state);
    }
  });
}
$("story").addEventListener("change", () => { commandError = ""; refresh(); loadCasting(); loadSounds(); });

// Sounds: like the casting, loaded when the story changes or after a change.
let soundStory = "";

function soundMessage(message, error) {
  $("soundmessage").textContent = message;
  $("soundmessage").className = error ? "msg err" : "msg";
}

function soundRow(sound, bank) {
  const item = document.createElement("li");
  const head = document.createElement("div");
  const theme = Object.assign(document.createElement("span"),
    { className: "theme", textContent: `[${sound.theme}]` });
  head.append(theme, ` chapitre ${sound.chapter}`);
  const before = Object.assign(document.createElement("div"),
    { className: "before muted", textContent: `après « ${sound.before} »` });
  const row = document.createElement("div");
  row.className = "row";
  const select = document.createElement("select");
  select.setAttribute("aria-label", `Fichier du son ${sound.theme}`);
  const option = (value, text) => Object.assign(document.createElement("option"), { value, textContent: text });
  select.append(option("", "— aucun fichier —"), ...bank.map(f => option(f, f)));
  if (sound.missing) select.append(option(sound.file, `${sound.file} (absent)`));
  select.value = sound.file;
  select.addEventListener("change", () => assignSound(sound, { file: select.value }));
  const listen = Object.assign(document.createElement("button"),
    { type: "button", className: "text", textContent: "Écouter" });
  listen.addEventListener("click", () => playSound(select.value));
  const upload = Object.assign(document.createElement("input"),
    { type: "file", accept: ".mp3,audio/mpeg", title: "Ajouter un MP3 à la banque et l'associer" });
  upload.setAttribute("aria-label", `Téléverser un MP3 pour ${sound.theme}`);
  upload.addEventListener("change", () => uploadSound(sound, upload.files[0]));
  const remove = Object.assign(document.createElement("button"),
    { type: "button", className: "text change", textContent: "Retirer" });
  remove.addEventListener("click", () => {
    if (confirm(`Retirer le son [${sound.theme}] du script ?`)) assignSound(sound, { remove: true });
  });
  row.append(select, listen, upload, remove);
  if (sound.suggested && !sound.file) {
    const use = Object.assign(document.createElement("button"),
      { type: "button", className: "text change", textContent: `Associer ${sound.suggested}` });
    use.addEventListener("click", () => assignSound(sound, { file: sound.suggested }));
    row.append(use);
  }
  item.append(head, before, row);
  return item;
}

function renderSounds(listing) {
  $("soundlist").replaceChildren(...listing.sounds.map(s => soundRow(s, listing.bank)));
  $("sounds").hidden = !listing.sounds.length;
  lockCasting();
}

async function loadSounds() {
  const story = $("story").value;
  soundStory = story;
  $("sounds").hidden = true;
  soundMessage("");
  if (!story) return;
  try {
    const listing = await call("GET", "stories/sounds?story=" + encodeURIComponent(story));
    if (soundStory === story) renderSounds(listing);
  } catch (e) {
    soundMessage(e.message, true);
  }
}

async function assignSound(sound, change) {
  soundMessage("");
  try {
    renderSounds(await call("POST", "stories/sound",
      { story: soundStory, chapter: sound.chapter, seg: sound.seg, ...change }));
    soundMessage(change.remove ? "Son retiré." : "Enregistré, pris en compte à la prochaine lecture.");
    refresh();
    loadStories().catch(() => {});      // its passage count changes
  } catch (e) {
    soundMessage(e.message, true);
    loadSounds();
  }
}

async function uploadSound(sound, file) {
  if (!file) return;
  soundMessage("Envoi…");
  try {
    // Named after the sound it makes, so other stories find it.
    const { file: name } = await call("POST", "stories/sounds/upload",
      { name: slug(sound.theme) || file.name, content: await base64(file) });
    await assignSound(sound, { file: name });
  } catch (e) {
    soundMessage(e.message, true);
    loadSounds();
  }
}

async function playSound(name) {
  if (!name) return soundMessage("Choisis d'abord un fichier.", true);
  try {
    const { content } = await call("GET", "stories/sounds/file?name=" + encodeURIComponent(name));
    await new Audio("data:audio/mpeg;base64," + content).play();
  } catch (e) {
    soundMessage(e.message, true);
  }
}

// Books: import, description, preparation of the chapters.  The form is only filled
// when the book changes or after a change, never by the refresh loop.
let shownBook = null;
let preparing = false;

function bookMessage(message, error) {
  $("bookmessage").textContent = message;
  $("bookmessage").className = error ? "msg err" : "msg";
}

function showBook(next) {
  shownBook = next;
  for (const field of document.querySelectorAll("#bookform .import")) field.hidden = !!next;
  $("file").required = $("newid").required = !next;
  $("booksave").textContent = next ? "Enregistrer" : "Importer";
  for (const key of ["title", "author", "year"]) $(key).value = next ? next[key] ?? "" : "";
  $("chapters").replaceChildren(...(next ? next.chapters : []).map(c => {
    const item = document.createElement("li");
    const label = document.createElement("span");
    label.textContent = `${c.chapter}. ${c.title || "Sans titre"} — ${c.segments} passages, ≈ ${c.minutes} min`
      + (c.prepared ? " — préparé ✓" : "");
    const button = document.createElement("button");
    button.type = "button";
    button.className = "text";
    button.textContent = c.prepared ? "Préparer à nouveau" : "Préparer";
    button.disabled = preparing;
    button.addEventListener("click", () => prepare(c));
    item.append(label, button);
    return item;
  }));
}

async function loadBooks(selected) {
  const { books, job } = await call("GET", "stories/books");
  const option = (id, text) => Object.assign(document.createElement("option"), { value: id, textContent: text });
  $("book").replaceChildren(...books.map(b => option(b.id, `${b.title} — ${b.author}`)),
                            option("", "Importer un livre…"));
  const wanted = selected ?? (job.running ? job.story : $("story").value);
  $("book").value = books.some(b => b.id === wanted) ? wanted : books.length ? books[0].id : "";
  renderJob(job);
  await openBook();
}

async function openBook() {
  const id = $("book").value;
  if (!id) return showBook(null);
  const next = await call("GET", "stories/book?story=" + encodeURIComponent(id));
  if ($("book").value === id) showBook(next);
}

function renderJob(job) {
  preparing = job.running;
  $("job").hidden = !job.story;
  const what = `${job.story}, chapitre ${job.chapter}`;
  $("jobstatus").textContent = job.running ? `Préparation en cours : ${what}…`
    : job.error ? `Préparation échouée (${what}) : ${job.error}` : `Préparation terminée : ${what}.`;
  $("jobstatus").className = job.error ? "err" : "";
  $("joblog").textContent = (job.log || []).join("\n");
  for (const button of $("chapters").querySelectorAll("button")) button.disabled = job.running;
}

async function prepare(chapter) {
  if (chapter.prepared && !confirm(
      "Préparer à nouveau ce chapitre écrase son script, corrections à la main comprises. Continuer ?")) return;
  bookMessage("");
  try {
    renderJob(await call("POST", "stories/prepare",
      { story: shownBook.id, chapter: chapter.chapter, overwrite: chapter.prepared }));
    watchJob();
  } catch (e) {
    bookMessage(e.message, true);
  }
}

let watching = false;
async function watchJob() {
  if (watching) return;
  watching = true;
  try {
    for (;;) {
      await new Promise(done => setTimeout(done, 2000));
      let job;
      try { ({ job } = await call("GET", "stories/books")); } catch (e) { continue; }
      renderJob(job);
      if (!job.running) break;
    }
    await openBook();
    await loadStories();
    await loadCasting();
    await loadSounds();
  } catch (e) {
    bookMessage(e.message, true);
  } finally {
    watching = false;
  }
}

const slug = text => text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
  .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
let ownId = false;
$("newid").addEventListener("input", () => { ownId = !!$("newid").value; });
$("title").addEventListener("input", () => { if (!ownId) $("newid").value = slug($("title").value); });

function base64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
    reader.onerror = () => reject(new Error("fichier illisible"));
    reader.readAsDataURL(file);
  });
}

$("bookform").addEventListener("submit", async event => {
  event.preventDefault();
  const year = $("year").value.trim();
  const body = { title: $("title").value, author: $("author").value,
                 year: year === "" ? null : Number(year) };
  const importing = !shownBook;
  $("booksave").disabled = true;
  bookMessage(importing ? "Import en cours…" : "");
  try {
    if (importing) {
      const file = $("file").files[0];
      Object.assign(body, { story: $("newid").value, filename: file.name,
                            rule: $("rule").value, content: await base64(file) });
    } else {
      body.story = shownBook.id;
    }
    const saved = await call("POST", importing ? "stories/import" : "stories/book", body);
    if (importing) { $("bookform").reset(); ownId = false; }
    await loadBooks(saved.id);
    await loadStories();
    bookMessage(importing ? `Livre importé : ${saved.chapters.length} chapitre(s).` : "Enregistré.");
    refresh();
  } catch (e) {
    bookMessage(e.message, true);
  } finally {
    $("booksave").disabled = false;
  }
});
$("book").addEventListener("change", () => {
  bookMessage("");
  openBook().catch(e => bookMessage(e.message, true));
});

async function loop() {
  await refresh();
  setTimeout(loop, 1000);
}
loadStories().then(loadCasting).then(loadSounds).catch(e => { commandError = e.message; }).finally(loop);
loadBooks().then(() => { if (preparing) watchJob(); }).catch(e => bookMessage(e.message, true));
</script>
</body>
</html>
