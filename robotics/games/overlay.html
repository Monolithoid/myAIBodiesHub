<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAO — jeux</title>
<style>
  /* OBS browser source: the panel fills the whole page, transparent, no frame —
     meant to be laid over a background picture in OBS (e.g. a chalkboard).
     Layout knobs: override them from OBS (browser source > Custom CSS), e.g. a framed
     panel in the bottom-right corner:
     :root { --panel-top: auto; --panel-left: auto; --panel-right: 24px; --panel-bottom: 24px;
             --panel-width: 520px; --panel-scale: 1; --panel-bg: rgba(18, 18, 28, 0.86);
             --panel-border-width: 2px; --panel-radius: 14px; --panel-padding: 16px 20px; }
     — see docs/obs-overlays.md. Stable hooks: #panel, #title, #view, #event, #footer,
     #scores, and one class per game view (.hangman). */
  :root {
    --panel-top: 0;
    --panel-right: 0;
    --panel-bottom: 0;
    --panel-left: 0;
    --panel-width: auto;              /* auto = between --panel-left and --panel-right */
    --panel-padding: 4% 5%;
    --panel-scale: 2;                 /* zooms the whole panel (text, drawings): 2 for 1920 px */
    --panel-bg: transparent;
    --panel-border: rgba(255, 255, 255, 0.18);
    --panel-border-width: 0;
    --panel-radius: 0;
    --panel-color: #f4f4f6;
    --panel-accent: #9fd3ff;          /* titles */
    --panel-highlight: #ffe08a;       /* last event, leader */
  }
  /* Same look whatever the source size (the scale follows the width, 960 px = 1). */
  @media (max-width: 1600px) { :root { --panel-scale: 1.333; } }
  @media (max-width: 1100px) { :root { --panel-scale: 1; } }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 22px/1.35 system-ui, "Segoe UI", sans-serif; color: var(--panel-color); }
  #panel {
    position: absolute; top: var(--panel-top); right: var(--panel-right);
    bottom: var(--panel-bottom); left: var(--panel-left);
    width: var(--panel-width); max-width: calc(100vw / var(--panel-scale));
    zoom: var(--panel-scale);
    background: var(--panel-bg);
    border: var(--panel-border-width) solid var(--panel-border);
    border-radius: var(--panel-radius); padding: var(--panel-padding); box-sizing: border-box;
    transition: opacity 0.4s; opacity: 0;
  }
  #panel.shown { opacity: 1; }
  #title { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--panel-accent); }
  #view { margin: 10px 0; }
  #view .big { font: 700 36px/1.2 ui-monospace, "Cascadia Mono", monospace; letter-spacing: 0.12em;
               word-break: break-all; }
  #view .line { color: #d6d6de; }
  /* Hangman */
  .hangman { display: flex; gap: 16px; align-items: flex-start; }
  .hangman svg { flex: none; width: 120px; height: 140px; }
  .hangman svg .part { stroke: var(--panel-color); stroke-width: 5; stroke-linecap: round; fill: none; }
  .hangman .side { flex: 1; min-width: 0; }
  /* The word always holds on one line: fitText() shrinks it when it is long. */
  .hangman .big { white-space: nowrap; word-break: normal; letter-spacing: 0.06em; }
  .hangman .def { font-size: 18px; font-style: italic; color: #cfe6ff; margin-top: 6px; }
  .hangman .tried { margin-top: 8px; font: 600 20px ui-monospace, monospace; letter-spacing: 0.1em; }
  .hangman .tried span { margin-right: 0.45em; }
  .hangman .tried .bad { color: #ff7b7b; text-decoration: line-through; }
  .hangman .words { font-size: 17px; letter-spacing: 0.04em; }
  .hangman .words span { margin-right: 0.9em; }
  .hangman .errors { font-size: 15px; color: #a8a8b8; }
  #event { font-size: 19px; color: var(--panel-highlight); min-height: 1.3em; }
  #footer { font-size: 15px; color: #a8a8b8; margin-top: 6px; }
  /* Ranking of the game (points of every game played, NAO included). */
  #scores { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 16px; color: #d6d6de; }
  #scores .row { max-width: 22em; }
  #scores:empty { display: none; }
  #scores .head { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--panel-accent); }
  #scores .row { display: flex; justify-content: space-between; }
  #scores .row.first { color: var(--panel-highlight); font-weight: 700; }
  #scores .inline span { margin-right: 14px; }
</style>
</head>
<body>
<div id="panel">
  <div id="title"></div>
  <div id="view"></div>
  <div id="event"></div>
  <div id="footer"></div>
  <div id="scores"></div>
</div>
<script>
"use strict";
// One renderer per game (id → function(view, element)); the default one shows
// view.big (one large line) and view.lines (smaller lines).
const views = {};

function text(tag, cls, value) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  el.textContent = value;
  return el;
}

function defaultView(view, el) {
  if (view.big) el.append(text("div", "big", view.big));
  for (const line of view.lines || []) el.append(text("div", "line", line));
}

// Hangman: the word (R _ _ _ T), the definition, the letters tried (wrong ones
// struck out in red), the wrong words proposed, the players hanged and the gallows drawn step by step with the errors.
const GALLOWS = [
  "M10 130 H80", "M30 130 V12", "M30 12 H85", "M85 12 V30",            // base, post, beam, rope
  "M85 30 m-11 11 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0",              // head
  "M85 52 V90", "M85 62 L68 78 M85 62 L102 78", "M85 90 L70 115 M85 90 L100 115",  // body, arms, legs
];
views.hangman = (view, el) => {
  const box = document.createElement("div");
  box.className = "hangman";
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 120 140");
  const max = Math.max(1, view.max_errors || GALLOWS.length);
  const shown = Math.round((view.errors || 0) * GALLOWS.length / max);
  GALLOWS.slice(0, shown).forEach(d => {
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "part");
    svg.append(path);
  });
  const side = text("div", "side", "");
  side.append(text("div", "big", view.mask || ""));
  if (view.definition) side.append(text("div", "def", view.definition));
  const tried = text("div", "tried", "");
  const wrong = new Set(view.wrong || []);
  for (const c of view.tried || []) tried.append(text("span", wrong.has(c) ? "bad" : "", c));
  side.append(tried);
  if ((view.wrong_words || []).length) {
    const words = text("div", "tried words", "");
    for (const w of view.wrong_words) words.append(text("span", "bad", w));
    side.append(words);
  }
  // Lives are per player: the gallows is the last player who erred.
  const who = view.errors_of ? ` de ${view.errors_of}` : "";
  side.append(text("div", "errors", `Erreurs${who} : ${view.errors || 0} / ${view.max_errors || ""}` +
                                    (view.level ? ` · niveau ${view.level}` : "")));
  const hanged = (view.players || []).filter(p => p.hanged).map(p => p.name);
  if (hanged.length) side.append(text("div", "errors", "Pendus : " + hanged.join(", ")));
  box.append(svg, side);
  el.append(box);
  fitText(side.querySelector(".big"), 36, 14);
};

// Shrinks an element's font until its text fits its width (one line).
function fitText(el, maxPx, minPx) {
  if (!el) return;
  let size = maxPx;
  el.style.fontSize = size + "px";
  while (size > minPx && el.scrollWidth > el.clientWidth) {
    size -= 1;
    el.style.fontSize = size + "px";
  }
}

// Ranking: the top 3 on one line during the game, the top 5 as a list at the end.
const MEDALS = ["🥇", "🥈", "🥉"];
function renderScores(scores, over) {
  const el = document.getElementById("scores");
  el.replaceChildren();
  const top = (scores && scores.top) || [];
  if (!top.length) return;
  el.append(text("div", "head", "Classement"));
  if (over) {
    top.slice(0, 5).forEach((s, i) => {
      const row = text("div", i === 0 ? "row first" : "row", "");
      row.append(text("span", "", (MEDALS[i] || `${i + 1}.`) + " " + s.name),
                 text("span", "", s.points + " pts"));
      el.append(row);
    });
  } else {
    const line = text("div", "inline", "");
    top.slice(0, 3).forEach((s, i) => line.append(text("span", "", `${MEDALS[i]} ${s.name} ${s.points}`)));
    el.append(line);
  }
}

const END_KINDS = new Set(["won", "lost", "cancelled", "over"]);
let hideTimer = null;

function render(state) {
  const panel = document.getElementById("panel");
  const activity = state.activity;
  const last = state.last_event;
  clearTimeout(hideTimer);
  if (!activity && !(last && END_KINDS.has(last.kind))) {
    panel.classList.remove("shown");
    return;
  }
  const viewEl = document.getElementById("view");
  viewEl.replaceChildren();
  if (activity) {
    document.getElementById("title").textContent = activity.name + " — en cours";
    (views[activity.game] || defaultView)(activity.view || {}, viewEl);
    document.getElementById("footer").textContent =
      activity.last_player ? "Dernier coup : " + activity.last_player : "Lancée par " + activity.started_by;
  } else {
    // Game just over: its last view and the last event stay on screen a little while.
    const final = state.final;
    if (final) (views[final.game] || defaultView)(final.view || {}, viewEl);
    document.getElementById("title").textContent = (final ? final.name + " — " : "") + "partie terminée";
    document.getElementById("footer").textContent = "";
    hideTimer = setTimeout(() => panel.classList.remove("shown"), 20000);
  }
  document.getElementById("event").textContent = last ? (last.say || last.text) : "";
  renderScores(state.scores, !activity);
  panel.classList.add("shown");
}

const token = new URLSearchParams(location.search).get("token") || "";
const source = new EventSource("/overlay/stream?token=" + encodeURIComponent(token));
let lastJson = "";
source.onmessage = (msg) => {
  if (msg.data === lastJson) return;   // keep-alive with the same state: keep the timers
  lastJson = msg.data;
  render(JSON.parse(msg.data));
};
</script>
</body>
</html>
