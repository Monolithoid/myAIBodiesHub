# openWakeWord training configuration for "ok nao" (see README.md).
# Paths relative to the folder where `python -m openwakeword.train` is run.

model_name: "ok_nao"
target_phrase: ["ok nao"]
custom_negative_phrases: []

# Number of clips: those written by generate_clips_fr.py in
# <output_dir>/<model_name>/{positive,negative}_{train,test}. Do not run
# --generate_clips: openWakeWord's generator only speaks English.
n_samples: 3000
n_samples_val: 300
tts_batch_size: 50
augmentation_batch_size: 16
# train.py always imports generate_samples from this folder: an empty
# module is enough (created by the notebook), the clips come from generate_clips_fr.py
piper_sample_generator_path: "./stub"
output_dir: "./sortie"

# Augmentation: room reverberation and background noise
rir_paths: ["./mit_rirs"]
background_paths: ["./audioset_16k", "./fma"]
background_paths_duplication_rate: [1, 1]
augmentation_rounds: 1

# Precomputed negatives (≈ 2000 h of speech, music, noise) and false-trigger
# validation (≈ 11 h), provided by openWakeWord on Hugging Face
feature_data_files:
  "ACAV100M_sample": "./openwakeword_features_ACAV100M_2000_hrs_16bit.npy"
false_positive_validation_data_path: "./validation_set_features.npy"
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32
steps: 50000
max_negative_weight: 1500
# Target false triggers per listening hour: lower = fewer spurious
# wake-ups, but "ok nao" sometimes missed
target_false_positives_per_hour: 0.2
