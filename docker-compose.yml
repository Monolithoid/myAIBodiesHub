version: "3.8"

# ============================================================
# AI STACK — ${DOMAIN}
# ============================================================
# Publicly exposed:
#   chat.${DOMAIN}   → Open WebUI  (port 3000)
#   ollama.${DOMAIN} → API Ollama  (port 11434)
#
# Internal services (SSH tunnel only):
#   n8n          → port 5678
#   bitterbot    → port 19001
#
# Persistent data under /opt/ia/:
#   /opt/ia/ollama/              → AI models
#   /opt/ia/webui/               → agents, users, history
#   /opt/ia/n8n/                 → workflows
#   /opt/ia/chroma/              → vector database
#   /opt/ia/bitterbot/           → SQLite memory, agent config
#   /opt/ia/nao/naoqi-sdk/       → NAOqi Python 2.7 SDK (provided by hand)
#   /opt/ia/whisper/             → Whisper ASR models (downloaded on first start)
#
# Before deploying:
#   mkdir -p /opt/ia/{ollama,webui,n8n,chroma}
#   mkdir -p /opt/ia/bitterbot/{config,workspace}
#   mkdir -p /opt/ia/nao/naoqi-sdk
#   mkdir -p /opt/ia/nao/persona
#   mkdir -p /opt/ia/whisper
#   cp core/bitterbot/bitterbot.json /opt/ia/bitterbot/config/bitterbot.json
#   # Extract the NAOqi Python 2.7 SDK into /opt/ia/nao/naoqi-sdk/
#   # (pynaoqi-python2.7-2.1.4.*-linux64.tar.gz from the SoftBank portal)
#
# Variables to set in Coolify → Environment Variables:
#   DOMAIN                   : your domain (e.g. mon-domain.com)
#   DOCKERHUB_USERNAME       : your Docker Hub username
#   OLLAMA_API_KEYS          : openssl rand -hex 32
#   WEBUI_SECRET_KEY         : openssl rand -hex 32
#   N8N_BASIC_AUTH_PASSWORD  : a password of your choice
#   OAUTH_CLIENT_ID          : Google Cloud Console → OAuth 2.0
#   OAUTH_CLIENT_SECRET      : same
#   BITTERBOT_GATEWAY_TOKEN  : openssl rand -hex 32
#   ROSBRIDGE_TOKEN          : openssl rand -hex 32 (token required by rosbridge-proxy,
#                              also to give to the NAO: nao_ws_bridge.py --token)
#   NAO_ROBOT_ID             : nao_01 (ROS2 identifier of the body)
#   NAO_MOTION_LIMITS        : JSON of the NAO driver's motion decisions (default: empty,
#                              e.g. {"rest_delay": 5}, see docs/nao.md "Motion decisions")
#   STATIC_DRONE_ID          : static_01 (ROS2 identifier of the static drone, ADR 004)
#   NAO_HEAD_YAW_OFFSET      : offset in degrees to turn the NAO's head towards the voice
#                              heard by the static drone (default: 0)
#   NAO_SPEAKING_SYNC        : 1 = the NAO moves while the static drone speaks,
#                              0 = disabled (default: 1)
#   SPEECH_GESTURE_SYNC      : 1 = a sentence and the learned gesture of the same answer start
#                              together, gesture duration fitted to the sentence (default: 1);
#                              the offset is set on the drone (GESTURE_SPEECH_OFFSET_MS)
#   SPEECH_CHARS_PER_S       : speech synthesis rate used to estimate a sentence (default: 14)
#   LLM_MOTION               : 1 = the LLM may send "motion" / "look" and the NAO head turns
#                              toward each voice (default: 1); 0 = NAO only moves through
#                              learned gestures (LLM or the static drone's reflex): the NAO
#                              driver also drops cognitive_renderer's head animations and
#                              stiffness changes (LEDs stay)
#   LISTEN_DURATION          : listening time after the wake word in seconds (default: 4.0)
#   ASR_MODEL                : Whisper model — tiny/base/small (default: small)
#
# Twitch and stream voice (ADR 005):
#   TWITCH_CHANNEL           : channel whose chat is read (e.g. monolithoid)
#   TWITCH_USER_COOLDOWN_S   : delay between two accepted messages from one viewer (default: 30)
#   TWITCH_BLOCKLIST         : banned words separated by commas (default: empty)
#   TWITCH_MODS_ONLY         : 1 = only moderators and the streamer can call !nao (default: 0)
#   OBS_DRONE_ID             : obs_01 (ROS2 identifier of the stream voice)
#   OBS_TOKEN                : openssl rand -hex 32 (secret of the OBS overlay URL)
#   REGIE_TOKEN              : openssl rand -hex 32 (secret of the control room URL)
#
# body-gateway brain (see docs/ia-stack.md, "Brain provider"):
#   BRAIN_PROVIDER           : ollama (default) | openai | anthropic
#   BRAIN_URL                : empty = provider default (Ollama: http://localhost:11434)
#   BRAIN_MODEL              : empty = qwen3:1.7b / gpt-4o-mini / claude-haiku-4-5
#   BRAIN_API_KEY            : provider key (default: OLLAMA_API_KEYS)
#   BRAIN_EFFORT             : Anthropic only, optional (low/medium/high)
#   NAO's personality        : /opt/ia/nao/persona/personnalite.md (missing = default text)
#
# Firewall (publicly exposed ports):
#   ufw allow 22
#   ufw allow 80
#   ufw allow 443
#   ufw deny 11434
#   ufw deny 3000
#   ufw deny 5678
#   ufw allow from 172.16.0.0/12 to any port 9090   # rosbridge-proxy (Docker bridge) → ros2-bridge
#   ufw deny 9090    # rosbridge goes through Traefik + rosbridge-proxy (token), never directly
#   ufw enable
# ============================================================

services:

  # ----------------------------------------------------------
  # OLLAMA — LLM engine
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /opt/ia/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_NUM_THREAD=8
      - OLLAMA_API_KEYS=${OLLAMA_API_KEYS}
    networks:
      - ai-network
      - bitterbot-net

  # ----------------------------------------------------------
  # OPEN WEBUI — agents interface
  # Access through Google SSO only (ENABLE_SIGNUP=false)
  # ----------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - /opt/ia/webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEYS}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - CHROMA_HTTP_HOST=chromadb
      - CHROMA_HTTP_PORT=8000
      - DEFAULT_MODELS=${DEFAULT_MODELS:-nao_brain}
      - ENABLE_SIGNUP=false
      - ENABLE_OAUTH_SIGNUP=true
      - ENABLE_API_KEY=true
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL}
      - OAUTH_PROVIDER_NAME=Google
      - OPENID_PROVIDER_URL=https://accounts.google.com/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=https://chat.${DOMAIN}/oauth/oidc/callback
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
    depends_on:
      ollama:
        condition: service_started
      chromadb:
        condition: service_started
    networks:
      - ai-network

  # ----------------------------------------------------------
  # N8N — workflows
  # Access through an SSH tunnel: ssh -L 5678:localhost:5678 $VPS_USER@${DOMAIN}
  # ----------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    volumes:
      - /opt/ia/n8n:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    networks:
      - ai-network

  # ----------------------------------------------------------
  # CHROMADB — vector memory
  # Internal only — never expose publicly
  # ----------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped
    volumes:
      - /opt/ia/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - ai-network

  # ----------------------------------------------------------
  # BITTERBOT — NAO's brain (disabled — see ADR 003)
  #
  # Bitterbot adds long-term memory and a dream engine, but its
  # /v1/chat/completions API was not stable. body-gateway now calls
  # Ollama directly (BRAIN_URL=http://localhost:11434).
  #
  # To re-enable: uncomment this block, remove the bitterbot-net
  # dependency below and change BRAIN_URL in body-gateway.
  # ----------------------------------------------------------
  # bitterbot-gateway:
  #   image: ${DOCKERHUB_USERNAME}/bitterbot:latest
  #   container_name: bitterbot-gateway
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:19001:19001"
  #   volumes:
  #     - /opt/ia/bitterbot/config:/home/node/.bitterbot
  #     - /opt/ia/bitterbot/workspace:/home/node/.bitterbot/workspace
  #   environment:
  #     HOME: /home/node
  #     TERM: xterm-256color
  #     BITTERBOT_GATEWAY_TOKEN: ${BITTERBOT_GATEWAY_TOKEN}
  #     OLLAMA_API_KEY: "ollama-local"
  #     BITTERBOT_SKIP_CHANNELS: "1"
  #     BITTERBOT_ONRAMP_URL: "http://127.0.0.1:1/disabled"
  #   command: ["node", "bitterbot.mjs", "gateway", "--bind", "lan", "--port", "19001"]
  #   depends_on:
  #     ollama:
  #       condition: service_started
  #   networks:
  #     - bitterbot-net

  # ----------------------------------------------------------
  # NAO BODY — ROS2 Humble physical layer
  #
  # Brain → body bridge services:
  #
  #   naoqi-driver       → ROS2 node, relays /bodies/{id}/actuators/* and
  #                         /naoqi/* to /nao/* (rosbridge → nao_ws_bridge).
  #                         NAO initiates the outbound WebSocket connection —
  #                         no robot IP address or port needed on the VPS side.
  #   static-driver      → ROS2 node (same nao-core container), relays
  #                         /drones/{id}/* (static drone, ADR 004) ↔ /bodies/{id}/*
  #                         with Whisper STT and edge-tts. Started a 2nd time
  #                         with OBS_DRONE_ID for the stream voice (ADR 005).
  #   cognitive-renderer → ROS2 node, /cognitive_state → LEDs + head continuously
  #   body-gateway       → ROS2 node, LLM bridge (BRAIN_PROVIDER) ↔ ROS2 bus
  #                         Injects a JSON system prompt on every call
  #                         Handles the dream ticks (DREAMING 2am-6am)
  #
  # Network: network_mode host for the ROS2 nodes (DDS domain 42)
  #
  # Multi-body: add one driver per robot/drone with a distinct
  # identifier, and add the ID to BODY_REGISTRY ("static…" IDs are
  # static drones, "obs…" the stream voice, the others NAOs).
  # ----------------------------------------------------------

  # ----------------------------------------------------------
  # WHISPER ASR — speech transcription (STT)
  #
  # Receives WAV files from naoqi-driver and returns
  # the transcribed text. The "small" model (461 MB) is a good
  # speed/accuracy trade-off for French on CPU.
  #
  # Internal access only (127.0.0.1:9000).
  # First start: model download (~460 MB).
  # ----------------------------------------------------------
  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper-asr
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /opt/ia/whisper:/root/.cache/whisper
    environment:
      - ASR_MODEL=${ASR_MODEL:-small}
      - ASR_LANGUAGE=fr
    networks:
      - ai-network

  # ----------------------------------------------------------
  # NAOQI BRIDGE — Python 2.7 HTTP bridge to the qi SDK
  #
  # Provides a local REST API to diagnose and test
  # each NAOqi capability (/say, /motion, /leds, /posture,
  # /move, /battery, /events) without publishing on the ROS2 bus.
  #
  # In normal operation (outbound WS), the bridge runs in
  # mock mode (connected=false) — no direct connection to the NAO
  # is needed on the VPS side. The real command path goes through
  # rosbridge → nao_ws_bridge (embedded on the robot).
  #
  # Local access only: 127.0.0.1:8090 on the host
  # (reachable from naoqi-driver in network_mode: host through
  # http://localhost:8090 and from ai-network through naoqi-bridge:8090)
  # ----------------------------------------------------------
  naoqi-bridge:
    image: ${DOCKERHUB_USERNAME}/naoqi-bridge:latest
    container_name: naoqi-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /opt/ia/nao/naoqi-sdk:/opt/naoqi-sdk
    environment:
      - BRIDGE_PORT=8090
      - RECONNECT_INTERVAL=15
      - ROSBRIDGE_URL=ws://rosbridge-proxy:80
      - ROSBRIDGE_TOKEN=${ROSBRIDGE_TOKEN:-}
    networks:
      - ai-network
      - robotics-net

  nao-core:
    image: ${DOCKERHUB_USERNAME}/nao-core:latest
    container_name: nao-core
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - PYTHONUNBUFFERED=1
      - ROBOT_ID=${NAO_ROBOT_ID:-nao_01}
      - WHISPER_URL=http://localhost:9000
      # Whisper prompt for the static drone: helps write "ok nao" correctly.
      - WHISPER_PROMPT=${WHISPER_PROMPT:-Ok Nao.}
      - LISTEN_DURATION=${LISTEN_DURATION:-4.0}
      - NAO_STATUS_TIMEOUT=${NAO_STATUS_TIMEOUT:-90}
      - MOTION_LIMITS=${NAO_MOTION_LIMITS:-}
      - TTS_VOICE=${TTS_VOICE:-fr-FR-DeniseNeural}
      - DRONE_ID=${STATIC_DRONE_ID:-static_01}
      - DRONE_STATUS_TIMEOUT=${DRONE_STATUS_TIMEOUT:-90}
      - SPEAKING_SYNC=${NAO_SPEAKING_SYNC:-1}
      - OBS_DRONE_ID=${OBS_DRONE_ID:-obs_01}
      # Constrained motor universe: arms only on LLM orders, motion-engine off.
      - RENDERER_ARMS=${NAO_RENDERER_ARMS:-0}
      - MOTION_ENGINE=${NAO_MOTION_ENGINE:-0}
      # LLM_MOTION=0: only learned gestures move NAO (no renderer head animation, no stiffness)
      - RAW_MOTION=${LLM_MOTION:-1}
    depends_on:
      whisper-asr:
        condition: service_started

  body-gateway:
    image: ${DOCKERHUB_USERNAME}/body-gateway:latest
    container_name: body-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TZ=${TZ:-Europe/Paris}
      - BRAIN_PROVIDER=${BRAIN_PROVIDER:-ollama}
      # Empty by default: body-gateway then uses the provider's values.
      - BRAIN_URL=${BRAIN_URL:-}
      - BRAIN_MODEL=${BRAIN_MODEL:-}
      - BRAIN_API_KEY=${BRAIN_API_KEY:-${OLLAMA_API_KEYS}}
      - BRAIN_EFFORT=${BRAIN_EFFORT:-}
      - BRAIN_PERSONA_FILE=/opt/nao/persona/personnalite.md
      - BODY_REGISTRY=${NAO_ROBOT_ID:-nao_01},${STATIC_DRONE_ID:-static_01},${OBS_DRONE_ID:-obs_01}
      - DREAMING_HOUR_START=${DREAMING_HOUR_START:-2}
      - DREAMING_HOUR_END=${DREAMING_HOUR_END:-6}
      - DREAMING_BATTERY_THRESHOLD=${DREAMING_BATTERY_THRESHOLD:-80.0}
      - DREAM_TICK_INTERVAL=${DREAM_TICK_INTERVAL:-300}
      - BRAIN_TIMEOUT=${BRAIN_TIMEOUT:-60}
      - CHAT_PORT=8095
      - WAKE_WORD=${WAKE_WORD:-ok nao}
      - WAKE_WINDOW_S=${WAKE_WINDOW_S:-10}
      # Other accepted spellings (empty = default list of body_gateway.py)
      - WAKE_ALIASES=${WAKE_ALIASES:-}
      - NAO_HEAD_YAW_OFFSET=${NAO_HEAD_YAW_OFFSET:-0}
      - SPEECH_GESTURE_SYNC=${SPEECH_GESTURE_SYNC:-1}
      - LLM_MOTION=${LLM_MOTION:-1}
      - SPEECH_CHARS_PER_S=${SPEECH_CHARS_PER_S:-14}
      - WEBUI_URL=${WEBUI_URL:-http://localhost:3000}
      - WEBUI_API_KEY=${WEBUI_API_KEY:-}
      - WEBUI_PIPE_MODEL=${WEBUI_PIPE_MODEL:-nao_brain}
      - WEBUI_VOICE_CHAT_ID=${WEBUI_VOICE_CHAT_ID:-}
    volumes:
      # NAO's personality, reread on every LLM call (persona.py)
      - /opt/ia/nao/persona:/opt/nao/persona:ro
    depends_on:
      nao-core:
        condition: service_started

  # ----------------------------------------------------------
  # ROS 2 BRIDGE — rosbridge WebSocket for the NAO script
  #
  # ros2-bridge runs in network_mode: host to share
  # DDS domain 42 with the other ROS2 nodes
  # ----------------------------------------------------------
  ros2-bridge:
    image: ${DOCKERHUB_USERNAME}/ros2-bridge:latest
    container_name: ros2-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

  # The only public entry point to rosbridge. Caddy only accepts a connection
  # if it carries the "Authorization: Bearer $ROSBRIDGE_TOKEN" header,
  # otherwise it answers 401. Without a configured token, the container refuses to start.
  #
  # Domain: to choose in Coolify (Domains field of the service), with https://
  # on container port 80, e.g. https://rosbridge.${DOMAIN}. TLS only.
  # The NAO, whose Python 2.7 cannot do TLS, goes through the static drone's
  # relay (ADR 006): no more plain-HTTP rosbridge.
  rosbridge-proxy:
    image: caddy:alpine
    container_name: rosbridge-proxy
    restart: unless-stopped
    environment:
      - ROSBRIDGE_TOKEN=${ROSBRIDGE_TOKEN:-}
    command:
      - sh
      - -c
      - |-
          if [ -z "$$ROSBRIDGE_TOKEN" ]; then
            echo "[rosbridge-proxy] ERROR: ROSBRIDGE_TOKEN not set" >&2
            exit 1
          fi
          hex=$$(awk 'NR>1 && $$2=="00000000" {print $$3; exit}' /proc/net/route)
          if [ -z "$$hex" ]; then
            echo "[rosbridge-proxy] ERROR: no default route in /proc/net/route" >&2
            exit 1
          fi
          gw=$$(printf '%d.%d.%d.%d' \
            "0x$${hex:6:2}" "0x$${hex:4:2}" "0x$${hex:2:2}" "0x$${hex:0:2}")
          echo "[rosbridge-proxy] host gateway detected: $$gw"
          export ROSBRIDGE_UPSTREAM="$$gw:9090"
          cat > /etc/caddy/Caddyfile <<'EOF'
          {
          	admin off
          }
          :80 {
          	@authorized header Authorization "Bearer {$$ROSBRIDGE_TOKEN}"
          	handle @authorized {
          		reverse_proxy {$$ROSBRIDGE_UPSTREAM}
          	}
          	handle {
          		respond 401
          	}
          }
          EOF
          exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    networks:
      - robotics-net
    depends_on:
      - ros2-bridge

  # ----------------------------------------------------------
  # CHAT RELAY — WebUI ↔ body-gateway bridge (HTTP)
  #
  # body-gateway runs in network_mode: host (needed for ROS2 DDS)
  # and therefore cannot be directly on ai-network.
  # This Caddy proxy bridges them: open-webui reaches it through chat-relay:8095,
  # and it relays to the host network gateway IP detected at startup.
  #
  # extra_hosts/host-gateway is NOT used: this Docker 20.10+ mechanism
  # does not work in some Coolify environments.
  # Instead, /proc/net/route (default route) is read to get
  # the Docker bridge gateway IP — available everywhere.
  # ----------------------------------------------------------
  chat-relay:
    image: caddy:alpine
    container_name: chat-relay
    restart: unless-stopped
    command:
      - sh
      - -c
      - |-
          hex=$$(awk 'NR>1 && $$2=="00000000" {print $$3; exit}' /proc/net/route)
          if [ -z "$$hex" ]; then
            echo "[chat-relay] ERROR: no default route in /proc/net/route" >&2
            exit 1
          fi
          gw=$$(printf '%d.%d.%d.%d' \
            "0x$${hex:6:2}" "0x$${hex:4:2}" "0x$${hex:2:2}" "0x$${hex:0:2}")
          echo "[chat-relay] host gateway detected: $$gw"
          exec caddy reverse-proxy --from :8095 --to "$$gw:8095"
    networks:
      - ai-network
    depends_on:
      - body-gateway

  # ----------------------------------------------------------
  # TWITCH INPUT — one more external stimulus (ADR 005)
  #
  # Like "ok nao" or an Open WebUI message: the "!nao …" chat messages
  # (anonymous read, no Twitch token) become a text
  # sent to body-gateway /chat. The brain returns the list of actions
  # and spreads it across the bodies itself (NAO, room voice, stream
  # voice). Without TWITCH_CHANNEL, the container refuses to start.
  # ----------------------------------------------------------
  twitch-input:
    image: ${DOCKERHUB_USERNAME}/twitch-input:latest
    container_name: twitch-input
    restart: unless-stopped
    environment:
      - TWITCH_CHANNEL=${TWITCH_CHANNEL:-}
      - BODY_GATEWAY_URL=http://chat-relay:8095
      - ROBOT_ID=${NAO_ROBOT_ID:-nao_01}
      - COMMAND_PREFIX=${TWITCH_COMMAND_PREFIX:-!nao}
      - USER_COOLDOWN_S=${TWITCH_USER_COOLDOWN_S:-30}
      - BLOCKLIST=${TWITCH_BLOCKLIST:-}
      - MODS_ONLY=${TWITCH_MODS_ONLY:-0}
    networks:
      - ai-network
    depends_on:
      - chat-relay

  # ----------------------------------------------------------
  # OBS AGENT — NAO's voice on the stream (ADR 005)
  #
  # "Voice" body like the static drone's speaker: it
  # connects to rosbridge (token), and static-driver (started a 2nd time
  # in nao-core with OBS_DRONE_ID) does the edge-tts synthesis.
  # Domain: to choose in Coolify (Domains field of the service), with the
  # container port, e.g. https://obs.${DOMAIN}:8096.
  # The voice reaches the OBS mixer through a browser source:
  #   https://<obs-agent domain>/overlay?token=$OBS_TOKEN
  #   (tick "Control audio via OBS")
  # It is only "connected" (and only receives speech) while
  # the overlay is open in OBS.
  # ----------------------------------------------------------
  obs-agent:
    image: ${DOCKERHUB_USERNAME}/obs-agent:latest
    container_name: obs-agent
    restart: unless-stopped
    environment:
      - DRONE_ID=${OBS_DRONE_ID:-obs_01}
      - ROSBRIDGE_URL=ws://rosbridge-proxy:80
      - ROSBRIDGE_TOKEN=${ROSBRIDGE_TOKEN:-}
      - OBS_TOKEN=${OBS_TOKEN:-}
      # Speech ↔ gesture sync: extra offset of the stream voice (ms) and longest wait
      - OBS_SPEECH_OFFSET_MS=${OBS_SPEECH_OFFSET_MS:-0}
      - SPEECH_SYNC_MAX_WAIT_S=${SPEECH_SYNC_MAX_WAIT_S:-4}
    networks:
      - robotics-net
    depends_on:
      - rosbridge-proxy

  # ----------------------------------------------------------
  # CONTROL ROOM (regie) — follow the streams between components (ADR 007)
  #
  # body-gateway publishes each input, LLM decision and routed
  # action on the ROS topic /events. The control room reads it through rosbridge
  # (token) and shows it live:
  #   https://<regie domain>/?token=$REGIE_TOKEN
  # Robot page (the only one that writes, on /nao/calibration and /nao/components):
  # motor profile calibration and the NAO's NAOqi components.
  #   https://<regie domain>/robot?token=$REGIE_TOKEN
  # OBS link: /obs?token=$REGIE_TOKEN redirects to the overlay
  # $OBS_URL/overlay?token=$OBS_TOKEN (OBS_URL = obs-agent domain,
  # e.g. https://obs.${DOMAIN}; empty = link disabled).
  # Domain: to choose in Coolify (Domains field of the service), with the
  # container port, e.g. https://regie.${DOMAIN}:8097.
  # Lichtblick, rqt or `ros2 topic echo /events` read the same topic.
  # ----------------------------------------------------------
  regie:
    image: ${DOCKERHUB_USERNAME}/regie:latest
    container_name: regie
    restart: unless-stopped
    environment:
      - ROSBRIDGE_URL=ws://rosbridge-proxy:80
      - ROSBRIDGE_TOKEN=${ROSBRIDGE_TOKEN:-}
      - REGIE_TOKEN=${REGIE_TOKEN:-}
      - OBS_URL=${OBS_URL:-}
      - OBS_TOKEN=${OBS_TOKEN:-}
    networks:
      - robotics-net
    depends_on:
      - rosbridge-proxy

# ============================================================
# NETWORKS
#
# ai-network (bridge, internet access):
#   ollama, open-webui, n8n, chromadb, whisper-asr, naoqi-bridge,
#   chat-relay, twitch-input
#
# bitterbot-net (bridge, internal: true — no internet access):
#   bitterbot-gateway, ollama
#   Bitterbot can only reach Ollama — all external access is blocked.
#
# robotics-net (bridge, internet access):
#   rosbridge-proxy — Caddy WebSocket proxy to ros2-bridge (host)
#   naoqi-bridge, obs-agent, regie — rosbridge-proxy clients (token)
#
# ROS2 nodes (ros2-bridge, nao-core, body-gateway):
#   network_mode: host — ROS2 Humble DDS (domain 42) on the host network.
# ============================================================
networks:
  ai-network:
    driver: bridge

  bitterbot-net:
    driver: bridge
    internal: true

  robotics-net:
    driver: bridge
